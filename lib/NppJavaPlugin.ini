[JavaPlugin]
; ============================================================================
; NppJavaPlugin Configuration File
; ============================================================================
;
; This configuration file allows you to customize the Java plugin behavior
; for Notepad++ 8.8.7 64-bit and later versions.
;
; Modifications to this file require restarting Notepad++ to take effect.
; ============================================================================

; Java Home Directory
; -------------------
; Specifies the root directory of your Java installation.
; This is used for compilation and running Java programs.
;
; If left empty, the plugin will use the JAVA_HOME environment variable.
; If JAVA_HOME is not set, you MUST configure this value.
;
; Examples:
;   JavaHome=C:\Program Files\Java\jdk-17
;   JavaHome=C:\Program Files\Java\jdk1.8.0_291
;   JavaHome=/usr/lib/jvm/java-17-openjdk
;
JavaHome=

; CFR Decompiler JAR Path
; -----------------------
; Specifies the path to the CFR decompiler JAR file.
; This is used for decompiling .class files.
;
; If left empty, the plugin will search for cfr*.jar in the plugin directory.
; If multiple cfr*.jar files exist, the first one found will be used.
;
; Examples:
;   CfrJarPath=cfr-0.152.jar (relative to plugin directory)
;   CfrJarPath=C:\path\to\cfr-0.152.jar (full path)
;   (Leave empty to auto-detect cfr*.jar in plugin directory)
;
CfrJarPath=

; ============================================================================
; Feature Notes
; ============================================================================
;
; - Compile Java files (Shift+F8)
;   Requires: JAVA_HOME or JavaHome configured
;
; - Run Java programs (Shift+F9)
;   Requires: JAVA_HOME or JavaHome configured
;
; - Compile and Run (Shift+F10)
;   Requires: JAVA_HOME or JavaHome configured
;
; - Decompile .class files
;   Requires: JAVA_HOME or JavaHome configured
;
; - Settings menu item
;   Opens this configuration file for editing
;
; ============================================================================
; Troubleshooting
; ============================================================================
;
; If compilation fails:
;   1. Check that JavaHome points to a valid JDK installation
;   2. Verify that 'javac.exe' exists in JavaHome\bin\
;   3. Restart Notepad++ after changing the configuration
;
; If decompilation fails:
;   1. Check that Java is available in PATH or configured
;   2. Ensure Java version 8 or higher is installed
;   3. Check the Java Console for error messages
;
; ============================================================================
